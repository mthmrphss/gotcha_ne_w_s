name: Global Intelligence Operations

on:
  push:                 # <-- BU KISMI EKLEYİN
    branches: ["main"]  # Ana dalınızın adı 'master' ise burayı değiştirin
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:       # Manuel tetikleme butonu (Test için)

permissions:
  contents: write           # Repoya yazma izni (JSON'u güncellemek için şart)

jobs:
  analyze_security_events:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # Takılırsa 15 dk sonra durdur

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install g4f feedparser requests curl_cffi
          pip install --upgrade --force-reinstall greenlet gevent

      - name: Run Intelligence Analyzer
        run: |
          python src/analyze.py

      - name: Commit and Push Results
        run: |
          git config --global user.name 'IntelBot'
          git config --global user.email 'bot@noreply.github.com'
          
          # Değişiklik var mı kontrol et
          if [[ -n $(git status -s data/) ]]; then
            git add data/latest_alerts.json data/history.json
            git commit -m "Intel Update: $(date -u)"
            git push
          else
            echo "No new alerts found. Nothing to commit."
          fi
