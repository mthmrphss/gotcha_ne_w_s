name: Global Intelligence Operations

on:
  push:                   # Kod güncellenince çalış
    branches: ["main"]
  schedule:
    - cron: '*/30 * * * *' # Her 30 dakikada bir çalış
  workflow_dispatch:      # Manuel tetikleme butonu

permissions:
  contents: write         # Repoya yazma izni

jobs:
  analyze_security_events:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 15 dk zaman aşımı

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install g4f feedparser requests curl_cffi
          pip install --upgrade --force-reinstall greenlet gevent

      - name: Run Intelligence Analyzer
        run: |
          # Dosyanız src klasöründeyse: python src/analyze.py
          # Dosyanız ana dizindeyse: python analyze.py
          # Sizin paylaştığınız snippet'e göre src/ içinde görünüyor:
          python src/analyze.py

      - name: Commit and Push Results
        run: |
          git config --global user.name 'IntelBot'
          git config --global user.email 'bot@noreply.github.com'
          
          # Değişiklik var mı kontrol et
          if [[ -n $(git status -s data/) ]]; then
            # --- KRİTİK GÜNCELLEME BURADA ---
            # daily_collection.json dosyasını da ekledik
            git add data/latest_alerts.json data/history.json data/daily_collection.json
            
            git commit -m "Intel Update: $(date -u)"
            git push
          else
            echo "No new alerts found. Nothing to commit."
          fi
