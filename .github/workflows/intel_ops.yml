name: Global Intelligence Operations

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '*/30 * * * *' # Her 30 dakikada bir çalış
  workflow_dispatch:       # Manuel tetikleme butonu

permissions:
  contents: write         # Repoya yazma izni

jobs:
  analyze_security_events:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      # DÜZELTME 1: g4f ve gereksizleri sildim. groq ve dotenv ekledim.
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install groq feedparser requests python-dotenv

      # DÜZELTME 2: API Key'i secret'tan alıp koda enjekte ettim.
      - name: Run Intelligence Analyzer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Python kodunuz src klasörü içindeyse:
          python src/analyze.py

      - name: Commit and Push Results
        run: |
          git config --global user.name 'IntelBot'
          git config --global user.email 'bot@noreply.github.com'
          
          # data klasöründeki değişiklikleri kontrol et
          if [[ -n $(git status -s data/) ]]; then
            
            # DÜZELTME 3: Tüm veri dosyalarını garantiye alarak ekliyoruz
            git add data/latest_alerts.json data/history.json data/daily_collection.json
            
            git commit -m "Intel Update: $(date -u)"
            git push
          else
            echo "No new alerts found. Nothing to commit."
          fi
